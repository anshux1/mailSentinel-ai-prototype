name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup baseline checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://mailsentinel:local-password@127.0.0.1:5432/mailsentinel
      TEST_DATABASE_URL: postgresql://mailsentinel:local-password@127.0.0.1:5432/mailsentinel
      BETTER_AUTH_SECRET: test-auth-secret-value-000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      ANALYZER_INTERNAL_URL: http://localhost:8000
      ANALYZER_SERVICE_TOKEN: test-analyzer-service-token-value-000000000000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mailsentinel-evidence
      S3_REQUEST_TIMEOUT_SECONDS: "10"
      S3_ACCESS_KEY_ID: local-access-key
      S3_SECRET_ACCESS_KEY: local-secret-key
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
      S3_FORCE_PATH_STYLE: "true"
      MAX_EML_BYTES: "26214400"
      RETENTION_DAYS: "90"
      UPLOAD_TIMEOUT_MS: "120000"
      ANALYZER_REQUEST_TIMEOUT_MS: "3000"
      REDIS_URL: redis://127.0.0.1:6379/0
      E2E_UPLOAD_ENABLED: "true"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mailsentinel
          POSTGRES_USER: mailsentinel
          POSTGRES_PASSWORD: local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailsentinel -d mailsentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:RELEASE.2025-09-06T17-59-47Z
        env:
          MINIO_ROOT_USER: local-access-key
          MINIO_ROOT_PASSWORD: local-secret-key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: apps/analyzer/uv.lock

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'apps/**/package.json', 'packages/**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install analyzer dependencies
        run: uv sync --locked --project apps/analyzer

      - name: Validate compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Initialize MinIO evidence bucket
        run: |
          docker run --rm --network host -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e S3_BUCKET --entrypoint /bin/sh minio/mc:RELEASE.2025-08-13T08-35-41Z -c '
            mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" --api S3v4 &&
            mc mb --ignore-existing "local/$S3_BUCKET" &&
            mc anonymous set none "local/$S3_BUCKET"
          '

      - name: Generate analyzer contracts
        run: pnpm contracts:generate

      - name: Check generated analyzer contracts
        run: git diff --exit-code -- apps/analyzer/contracts/openapi.json packages/contracts/src/analyzer.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Prepare synthetic browser credentials
        run: |
          echo "SEED_ORGANIZATION_NAME=MailSentinel CI Lab" >> "$GITHUB_ENV"
          echo "SEED_ORGANIZATION_SLUG=ci-security-lab" >> "$GITHUB_ENV"
          echo "SEED_ANALYST_EMAIL=analyst@example.test" >> "$GITHUB_ENV"
          echo "SEED_ANALYST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SEED_SUPERVISOR_EMAIL=supervisor@example.test" >> "$GITHUB_ENV"
          echo "SEED_SUPERVISOR_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Seed browser test users
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm --filter @mailsentinel/web exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Build workspaces
        run: pnpm build

      - name: Validate analyzer container build definition
        run: docker build --target runtime -f apps/analyzer/Dockerfile .
