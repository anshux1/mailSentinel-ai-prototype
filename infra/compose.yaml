name: mailsentinel-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mailsentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mailsentinel
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-06T17-59-47Z
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mailsentinel
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" --api S3v4 &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - mailsentinel

  analyzer:
    build:
      context: ..
      dockerfile: apps/analyzer/Dockerfile
    image: mailsentinel-analyzer:local
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      ANALYZER_SERVICE_NAME: mailsentinel-analyzer
      ANALYZER_SERVICE_VERSION: 0.1.0
      ANALYSIS_VERSION: prototype-1
      ENRICHMENT_MODE: offline
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_REQUEST_TIMEOUT_SECONDS: ${S3_REQUEST_TIMEOUT_SECONDS:-10}
      ANALYZER_SERVICE_TOKEN: ${ANALYZER_SERVICE_TOKEN:?Set ANALYZER_SERVICE_TOKEN in .env}
      ANALYZER_PORT: 8000
      DRAMATIQ_QUEUE_NAME: ${DRAMATIQ_QUEUE_NAME:-mailsentinel.analysis}
      DRAMATIQ_MAX_RETRIES: ${DRAMATIQ_MAX_RETRIES:-3}
      DRAMATIQ_MIN_BACKOFF_MS: ${DRAMATIQ_MIN_BACKOFF_MS:-1000}
      DRAMATIQ_MAX_BACKOFF_MS: ${DRAMATIQ_MAX_BACKOFF_MS:-30000}
      READINESS_CHECKS_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - mailsentinel
    profiles: ["app"]

  worker:
    image: mailsentinel-analyzer:local
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      ANALYZER_SERVICE_NAME: mailsentinel-analyzer
      ANALYZER_SERVICE_VERSION: 0.1.0
      ANALYSIS_VERSION: prototype-1
      ENRICHMENT_MODE: offline
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_REQUEST_TIMEOUT_SECONDS: ${S3_REQUEST_TIMEOUT_SECONDS:-10}
      ANALYZER_SERVICE_TOKEN: ${ANALYZER_SERVICE_TOKEN:?Set ANALYZER_SERVICE_TOKEN in .env}
      ANALYZER_PORT: 8000
      DRAMATIQ_QUEUE_NAME: ${DRAMATIQ_QUEUE_NAME:-mailsentinel.analysis}
      DRAMATIQ_MAX_RETRIES: ${DRAMATIQ_MAX_RETRIES:-3}
      DRAMATIQ_MIN_BACKOFF_MS: ${DRAMATIQ_MIN_BACKOFF_MS:-1000}
      DRAMATIQ_MAX_BACKOFF_MS: ${DRAMATIQ_MAX_BACKOFF_MS:-30000}
      READINESS_CHECKS_ENABLED: "true"
    depends_on:
      analyzer:
        condition: service_healthy
    network_mode: "service:analyzer"
    profiles: ["app"]

networks:
  mailsentinel:
    name: mailsentinel-local

volumes:
  postgres-data:
  redis-data:
  minio-data:
